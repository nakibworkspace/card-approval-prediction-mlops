name: CD - Continuous Deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'pulumi/**'
  workflow_dispatch:

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ============================================
  # Build & Push all Docker images to DockerHub
  # ============================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - image: card-approval-api
            dockerfile: Dockerfile
            context: .
          - image: card-approval-airflow
            dockerfile: airflow/Dockerfile
            context: .
          - image: card-approval-mlflow
            dockerfile: mlflow/Dockerfile
            context: .
          - image: card-approval-prometheus
            dockerfile: monitoring/prometheus/Dockerfile
            context: monitoring/prometheus
          - image: card-approval-grafana
            dockerfile: monitoring/grafana/Dockerfile
            context: monitoring/grafana
          - image: card-approval-loki
            dockerfile: monitoring/loki/Dockerfile
            context: monitoring/loki
          - image: card-approval-promtail
            dockerfile: monitoring/promtail/Dockerfile
            context: monitoring/promtail
          - image: card-approval-tempo
            dockerfile: monitoring/tempo/Dockerfile
            context: monitoring/tempo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ env.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Deploy API Stack (EC2-1: 10.0.1.10)
  # ============================================
  deploy-api:
    name: Deploy API Stack
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_API_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/app
            git pull origin main

            # Write .env from secrets
            cat > .env <<'EOF'
            POSTGRES_API_PASSWORD=${{ secrets.POSTGRES_API_PASSWORD }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            MLFLOW_TRACKING_URI=http://10.0.1.20:5000
            MODEL_NAME=card_approval_model
            MODEL_STAGE=Production
            OTEL_ENABLED=true
            OTEL_EXPORTER_ENDPOINT=http://10.0.1.30:4317
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            EOF

            # Pull latest images and restart
            docker-compose -f docker-compose.api.yml pull
            docker-compose -f docker-compose.api.yml up -d

            # Health check
            sleep 30
            curl -sf http://localhost/health || echo "WARNING: API health check failed"

  # ============================================
  # Deploy Airflow & MLflow Stack (EC2-2: 10.0.1.20)
  # ============================================
  deploy-airflow-mlflow:
    name: Deploy Airflow & MLflow Stack
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_AIRFLOW_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/app
            git pull origin main

            # Write .env from secrets
            cat > .env <<'EOF'
            POSTGRES_MLFLOW_PASSWORD=${{ secrets.POSTGRES_MLFLOW_PASSWORD }}
            POSTGRES_AIRFLOW_PASSWORD=${{ secrets.POSTGRES_AIRFLOW_PASSWORD }}
            AIRFLOW_FERNET_KEY=${{ secrets.AIRFLOW_FERNET_KEY }}
            AIRFLOW_SECRET_KEY=${{ secrets.AIRFLOW_SECRET_KEY }}
            AIRFLOW_ADMIN_PASSWORD=${{ secrets.AIRFLOW_ADMIN_PASSWORD }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            KAGGLE_USERNAME=${{ secrets.KAGGLE_USERNAME }}
            KAGGLE_KEY=${{ secrets.KAGGLE_KEY }}
            EOF

            # Pull latest images and restart
            docker-compose -f docker-compose.airflow.yml pull
            docker-compose -f docker-compose.airflow.yml up -d

            # Health check
            sleep 30
            curl -sf http://localhost:5000 || echo "WARNING: MLflow health check failed"

  # ============================================
  # Deploy Monitoring Stack (EC2-3: 10.0.1.30)
  # ============================================
  deploy-monitoring:
    name: Deploy Monitoring Stack
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_MONITORING_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/app
            git pull origin main

            # Write .env from secrets
            cat > .env <<'EOF'
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            EOF

            # Pull latest images and restart
            docker-compose -f docker-compose.monitoring.yml pull
            docker-compose -f docker-compose.monitoring.yml up -d

            # Health check
            sleep 30
            curl -sf http://localhost:3000/api/health || echo "WARNING: Grafana health check failed"
