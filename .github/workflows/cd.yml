name: CD - Continuous Deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'pulumi/**'
  workflow_dispatch:

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  AWS_REGION: ap-southeast-1

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - image: card-approval-api
            dockerfile: Dockerfile
            context: .
          - image: card-approval-airflow
            dockerfile: airflow/Dockerfile
            context: .
          - image: card-approval-mlflow
            dockerfile: mlflow/Dockerfile
            context: .
          - image: card-approval-prometheus
            dockerfile: monitoring/prometheus/Dockerfile
            context: monitoring/prometheus
          - image: card-approval-grafana
            dockerfile: monitoring/grafana/Dockerfile
            context: monitoring/grafana
          - image: card-approval-loki
            dockerfile: monitoring/loki/Dockerfile
            context: monitoring/loki
          - image: card-approval-promtail
            dockerfile: monitoring/promtail/Dockerfile
            context: monitoring/promtail
          - image: card-approval-tempo
            dockerfile: monitoring/tempo/Dockerfile
            context: monitoring/tempo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-api:
    name: Deploy API Stack (EC2-1)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_API_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/app
            git pull origin main
            docker-compose -f docker-compose.api.yml pull
            docker-compose -f docker-compose.api.yml up -d
            # Wait and verify health
            sleep 30
            curl -sf http://localhost/health || echo "WARNING: Health check failed"

  deploy-airflow-mlflow:
    name: Deploy Airflow & MLflow Stack (EC2-2)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_AIRFLOW_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/app
            git pull origin main
            docker-compose -f docker-compose.airflow.yml pull
            docker-compose -f docker-compose.airflow.yml up -d
            # Wait and verify MLflow is up
            sleep 30
            curl -sf http://localhost:5000 || echo "WARNING: MLflow health check failed"

  deploy-monitoring:
    name: Deploy Monitoring Stack (EC2-3)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_MONITORING_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/app
            git pull origin main
            docker-compose -f docker-compose.monitoring.yml pull
            docker-compose -f docker-compose.monitoring.yml up -d
            # Wait and verify Grafana is up
            sleep 30
            curl -sf http://localhost:3000/api/health || echo "WARNING: Grafana health check failed"
