name: CD - Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  IMAGE_NAME: card-approval-api
  AWS_REGION: us-east-1

jobs:
  model-evaluation:
    name: Evaluate MLflow Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download model from MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MODEL_NAME: card_approval_model
          MODEL_STAGE: Production
        run: |
          python scripts/download_model.py

      - name: Evaluate model performance
        env:
          F1_THRESHOLD: 0.90
        run: |
          python scripts/evaluate_model.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: models/

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: model-evaluation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-app-runner:
    name: Deploy to AWS App Runner
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to App Runner
        run: |
          # Check if service exists
          SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='card-approval-api'].ServiceArn" --output text)
          
          if [ -z "$SERVICE_ARN" ]; then
            echo "Creating new App Runner service..."
            aws apprunner create-service \
              --service-name card-approval-api \
              --source-configuration '{
                "ImageRepository": {
                  "ImageIdentifier": "${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest",
                  "ImageRepositoryType": "ECR_PUBLIC",
                  "ImageConfiguration": {
                    "Port": "8000",
                    "RuntimeEnvironmentVariables": {
                      "MLFLOW_TRACKING_URI": "${{ secrets.MLFLOW_TRACKING_URI }}",
                      "MODEL_NAME": "card_approval_model",
                      "MODEL_STAGE": "Production",
                      "AWS_DEFAULT_REGION": "${{ env.AWS_REGION }}"
                    }
                  }
                },
                "AutoDeploymentsEnabled": true
              }' \
              --instance-configuration '{
                "Cpu": "1 vCPU",
                "Memory": "2 GB"
              }' \
              --health-check-configuration '{
                "Protocol": "HTTP",
                "Path": "/health",
                "Interval": 10,
                "Timeout": 5,
                "HealthyThreshold": 1,
                "UnhealthyThreshold": 5
              }'
          else
            echo "Updating existing App Runner service..."
            aws apprunner update-service \
              --service-arn $SERVICE_ARN \
              --source-configuration '{
                "ImageRepository": {
                  "ImageIdentifier": "${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest",
                  "ImageConfiguration": {
                    "Port": "8000",
                    "RuntimeEnvironmentVariables": {
                      "MLFLOW_TRACKING_URI": "${{ secrets.MLFLOW_TRACKING_URI }}",
                      "MODEL_NAME": "card_approval_model",
                      "MODEL_STAGE": "Production",
                      "AWS_DEFAULT_REGION": "${{ env.AWS_REGION }}"
                    }
                  }
                }
              }'
          fi

      - name: Wait for deployment
        run: |
          echo "Waiting for App Runner service to be ready..."
          aws apprunner wait service-running --service-arn $(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='card-approval-api'].ServiceArn" --output text)

      - name: Get service URL
        id: get-url
        run: |
          SERVICE_URL=$(aws apprunner describe-service --service-arn $(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='card-approval-api'].ServiceArn" --output text) --query "Service.ServiceUrl" --output text)
          echo "service_url=https://$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "Service deployed at: https://$SERVICE_URL"

      - name: Health check
        run: |
          sleep 30
          curl -f ${{ steps.get-url.outputs.service_url }}/health || exit 1

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-app-runner]
    if: always()

    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy-app-runner.result }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
