services:
  # ============================================
  # PostgreSQL for FastAPI (Predictions)
  # ============================================
  postgres-api:
    image: postgres:15-alpine
    container_name: postgres-api
    environment:
      POSTGRES_DB: card_approval_api
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: ${POSTGRES_API_PASSWORD:-api_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-api-data:/var/lib/postgresql/data
      - ./init-scripts/init-api-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d card_approval_api"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # ============================================
  # Redis (Caching)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # ============================================
  # FastAPI Application
  # ============================================
  api:
    image: nakibahmed/card-approval-api:latest
    container_name: card-approval-api
    environment:
      # Database
      POSTGRES_HOST: postgres-api
      POSTGRES_PORT: 5432
      POSTGRES_DB: card_approval_api
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: ${POSTGRES_API_PASSWORD:-api_password}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}

      # MLflow (remote - EC2-2)
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://10.0.1.20:5000}
      MODEL_NAME: card_approval_model
      MODEL_STAGE: Production

      # AWS
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

      # Tracing (remote - EC2-3)
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: card-approval-api
      OTEL_EXPORTER_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT:-http://10.0.1.30:4317}
      OTEL_SAMPLING_RATE: 1.0
    ports:
      - "8000:8000"
    depends_on:
      postgres-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # ============================================
  # Nginx (Reverse Proxy - API only)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-api.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  postgres-api-data:
  redis-data:
  nginx-logs:
