global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'card-approval-api'
    environment: 'production'

# Load alert rules
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  - job_name: 'card-approval-api'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
